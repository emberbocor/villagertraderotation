modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/emberbocor/villagertraderotation/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/emberbocor/villagertraderotation"
authors="emberbocor"
displayTest="IGNORE_SERVER_VERSION"
description='''
Villager trades rotate automatically: once a day by default, each villager rolls new trades for all its unlocked levels at its job site.
Only needed on the server: players without the mod can join. Also works in singleplayer.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
